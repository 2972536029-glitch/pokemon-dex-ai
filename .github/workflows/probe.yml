# 生产拨测(ROADMAP-NEXT T3,v3.3 增强):runner 在海外,不受"本机到
# vercel.app 断网"影响——这是生产可用性的持续监控通道。每 30min:
#   1. GET /api/health         断言 db:"ok"(HTTP 200)
#   2. GET /api/poke/pokemon/25 断言 200(代理链路:PokeAPI + 24h 缓存)
#   3. GET 首页                断言包含 SPA root div(部署产物完整性)
#   4. POST 登录冒烟           断言 200 + Set-Cookie 是 __Host-dex_session
#                              (用户主路径 + T6 cookie 前缀的常驻线上验证;
#                              PROBE_USER/PROBE_PASS 未配置时优雅跳过)
# 连续 2 次失败 → 开/追 probe-alert issue(同类 issue 去重,只有一个);
# 任一次成功 → 自动关闭 open 的 probe-alert issue(自愈闭环)。
# 连续计数存 Actions cache(cache/restore + save 配对,restore-keys 前缀
# 拿最近一次的状态;key 含 run_id 保证每次都保存新快照)。
# 死人开关:每次运行 ping HC_PING_URL(healthchecks.io 类,成功 ping 本体、
# 失败 ping /fail)——拨测自身停转(60 天不活跃被 GitHub 禁用/计费停摆)时
# 由外部服务按超时告警,监控不再"自身失明"。未配置时跳过。
name: Probe

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: probe
  cancel-in-progress: false

env:
  PROD_URL: https://pokemon-dex-ai.vercel.app

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Restore consecutive-failure counter
        uses: actions/cache/restore@v4
        with:
          path: probe-state
          key: probe-state-${{ github.run_id }}
          restore-keys: probe-state-

      - name: Probe /api/health
        id: health
        run: |
          set -o pipefail
          BODY=$(curl -fsS --max-time 30 "$PROD_URL/api/health") || { echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "$BODY"
          echo "$BODY" | jq -e '.db == "ok"' > /dev/null && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Probe /api/poke proxy
        id: poke
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$PROD_URL/api/poke/pokemon/25") || CODE=000
          echo "status=$CODE"
          [ "$CODE" = "200" ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Probe homepage shell
        id: home
        run: |
          HTML=$(curl -fsS --max-time 30 "$PROD_URL/") || { echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "$HTML" | grep -q '<div id="root">' && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Probe login smoke (also verifies __Host- cookie)
        id: login
        env:
          PROBE_USER: ${{ secrets.PROBE_USER }}
          PROBE_PASS: ${{ secrets.PROBE_PASS }}
        run: |
          if [ -z "$PROBE_USER" ] || [ -z "$PROBE_PASS" ]; then
            echo "::notice::PROBE_USER/PROBE_PASS 未配置,登录冒烟跳过"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESP=$(curl -fsS -i --max-time 30 -X POST "$PROD_URL/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"$PROBE_USER\",\"password\":\"$PROBE_PASS\"}") || RESP=""
          CODE=$(printf '%s' "$RESP" | head -n1 | grep -oE '[0-9]{3}' | head -n1 || echo 000)
          SETCOOKIE=$(printf '%s' "$RESP" | grep -i '^set-cookie:' | head -n1 || true)
          echo "status=$CODE"
          # 200 + 生产会话 cookie 名(__Host- 前缀)同时在线才算通过
          if [ "$CODE" = "200" ] && printf '%s' "$SETCOOKIE" | grep -q '__Host-dex_session='; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Evaluate
        id: eval
        run: |
          FAILED=0
          [ "${{ steps.health.outputs.ok }}" = "true" ] || FAILED=$((FAILED+1))
          [ "${{ steps.poke.outputs.ok }}" = "true" ] || FAILED=$((FAILED+1))
          [ "${{ steps.home.outputs.ok }}" = "true" ] || FAILED=$((FAILED+1))
          if [ "${{ steps.login.outputs.skipped }}" = "true" ]; then
            LOGIN_TXT="login=skipped"
          else
            [ "${{ steps.login.outputs.ok }}" = "true" ] || FAILED=$((FAILED+1))
            LOGIN_TXT="login=${{ steps.login.outputs.ok }}"
          fi
          echo "failed_checks=$FAILED" >> "$GITHUB_OUTPUT"
          echo "reason=health=${{ steps.health.outputs.ok }},poke=${{ steps.poke.outputs.ok }},home=${{ steps.home.outputs.ok }},$LOGIN_TXT" >> "$GITHUB_OUTPUT"

      - name: Handle failure (open/comment issue after 2 consecutive failures)
        if: steps.eval.outputs.failed_checks != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT_FILE=probe-state/fail-count
          PREV=$(cat "$COUNT_FILE" 2>/dev/null || echo 0)
          COUNT=$((PREV + 1))
          mkdir -p probe-state
          echo "$COUNT" > "$COUNT_FILE"
          BODY="拨测失败(连续第 $COUNT 次)。结果: ${{ steps.eval.outputs.reason }}。详情见 [Actions 运行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。"
          if [ "$COUNT" -lt 2 ]; then
            echo "连续失败 $COUNT 次,未达开 issue 阈值(2)"
            exit 0
          fi
          EXISTING=$(gh issue list --label probe-alert --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "probe: production probe failing" --label probe-alert --body "$BODY"
          fi

      - name: Handle success (auto-close recovered issues)
        if: steps.eval.outputs.failed_checks == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p probe-state
          echo 0 > probe-state/fail-count
          OPEN=$(gh issue list --label probe-alert --state open --json number --jq '.[].number' || echo "")
          for n in $OPEN; do
            gh issue close "$n" --comment "拨测恢复(${{ steps.eval.outputs.reason }}):全部检查通过(登录未配置时跳过)。"
          done

      - name: Dead man's switch (healthchecks.io ping)
        if: always()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          if [ -z "$HC_PING_URL" ]; then
            echo "::notice::HC_PING_URL 未配置,死人开关跳过"
            exit 0
          fi
          if [ "${{ steps.eval.outputs.failed_checks }}" = "0" ]; then
            curl -fsS --max-time 15 "$HC_PING_URL" || echo "::warning::ping 失败(拨测本身通过)"
          else
            curl -fsS --max-time 15 "$HC_PING_URL/fail" || echo "::warning::fail-ping 失败"
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: probe-state
          key: probe-state-${{ github.run_id }}
